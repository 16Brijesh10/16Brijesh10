name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 16Brijesh10
          template: classic
          base: ""
          filename: github-metrics.svg # Keep this name simple
          
          # --- 3D CALENDAR ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- LANGUAGES (Recently Used) ---
          plugin_languages: yes
          plugin_languages_indepth: yes # <--- CRITICAL: recently-used needs this
          plugin_languages_sections: recently-used
          plugin_languages_recent_load: 300
