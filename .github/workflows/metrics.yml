name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 16Brijesh10
          template: classic
          base: ""
          filename: github-metrics-isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
