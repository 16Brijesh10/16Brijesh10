name: Full Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 16Brijesh10
          template: classic
          base: ""
          
          # This part handles the Languages section you shared
          plugin_languages: yes
          plugin_languages_sections: recently-used
          
          # This part handles the Full Year Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year


